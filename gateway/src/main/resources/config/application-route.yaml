spring:
  cloud:
    gateway:
      # 全局跨域
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-headers: "*"
            allowed-methods: "*"
      default-filters:
        - AddRequestHeader=X-Request-From, planning-gateway
        - AddResponseHeader=X-Response-From, planning-gateway
      routes:
        - id: planning-scheduler
          uri: lb://planning-scheduler
          predicates:
            - Path=/api/scheduler/**
          filters:
            - RewritePath=/api/scheduler/(?<segment>.*), /planning-scheduler/web/v1/$\{segment}
        - id: planning-plan
          uri: lb://planning-plan
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/plan/**
                  - /api/plan1/**
                match-trailing-slash: true
            - name: Query
              args:
                param: app_code
                regexp: test5
          filters:
            - RewritePath=/api/plan/(?<segment>.*), /planning-plan/web/v1/$\{segment}
            - RewritePath=/api/plan1/(?<segment>.*), /planning-plan/web/v1/$\{segment}
        - id: planning-experiment
          uri: lb://planning-experiment
          predicates:
            - Path=/api/experiment/**
#            - Token=Authorization
            - name: Token
              args:
                header-name: Authorization
          filters:
            - RewritePath=/api/experiment/(?<segment>.*), /planning-experiment/web/v1/$\{segment}
#            - Timer=true
            - name: Timer
              args:
                enabled: true
